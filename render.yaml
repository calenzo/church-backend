# Render Blueprint — backend do Assistente da Igreja
# Como usar: envie este repositório para o GitHub e importe em
# https://dashboard.render.com/blueprints informando a URL do repo.
# Depois de criar, preencha no dashboard os segredos marcados com `sync: false`.
services:
  - type: web
    name: church-backend
    runtime: docker
    repo: https://github.com/calenzo/church-backend.git
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: church-postgres
          property: connectionString
      - key: EVOLUTION_BASE_URL
        value: https://church-evolution.onrender.com
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        value: church
      - key: WEBHOOK_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false

  - type: web
    name: church-evolution
    runtime: image
    image:
      url: docker.io/evoapicloud/evolution-api:latest
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_ENABLED
        value: "true"
      - key: DATABASE_PROVIDER
        value: postgresql
      # Apontar para uma database "evolution" no MESMO Postgres do backend
      # (só há 1 Postgres free por workspace). Pegue a connection string do
      # church-postgres e troque o nome do banco para "evolution".
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: DATABASE_SAVE_DATA_INSTANCE
        value: "true"
      - key: DATABASE_SAVE_DATA_NEW_MESSAGE
        value: "true"
      - key: DATABASE_SAVE_MESSAGE_UPDATE
        value: "true"
      - key: CACHE_REDIS_ENABLED
        value: "false"
      - key: AUTHENTICATION_API_KEY
        sync: false
      - key: WEBHOOK_GLOBAL_ENABLED
        value: "true"
      - key: WEBHOOK_GLOBAL_URL
        value: https://church-backend-vzzp.onrender.com/webhook/evolution

databases:
  - name: church-postgres
    databaseName: church
    user: church
    plan: free
