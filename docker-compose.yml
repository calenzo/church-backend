services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  evolution:
    image: evoapicloud/evolution-api:latest
    ports:
      - "8080:8080"
    environment:
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgres://postgres:postgres@postgres:5432/evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "true"
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-MUDAR_ESTA_CHAVE}
      # Dentro da rede Docker o backend é alcançado pelo nome do serviço.
      # Para acesso externo, troque por http://<IP-DA-MAQUINA>:8000/webhook/evolution
      WEBHOOK_GLOBAL_URL: http://backend:8000/webhook/evolution
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/church
      EVOLUTION_BASE_URL: http://evolution:8080
      LLM_BASE_URL: http://ollama:11434
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  pgdata:
  ollamadata:
