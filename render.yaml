# Render Blueprint — backend do Assistente da Igreja
# Como usar: envie este repositório para o GitHub e importe em
# https://dashboard.render.com/blueprints informando a URL do repo.
# Depois de criar, preencha no dashboard os segredos marcados com `sync: false`.
services:
  - type: web
    name: church-backend
    runtime: docker
    repo: https://github.com/calenzo/church-backend.git
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: church-postgres
          property: connectionString
      # URL pública da Evolution API (ex.: http://SEU-IP:8080 ou https://sub.dominio)
      - key: EVOLUTION_BASE_URL
        sync: false
      - key: EVOLUTION_API_KEY
        sync: false
      - key: EVOLUTION_INSTANCE
        value: church
      - key: WEBHOOK_TOKEN
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: LLM_API_KEY
        sync: false

databases:
  - name: church-postgres
    databaseName: church
    user: church
    plan: free
